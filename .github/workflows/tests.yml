name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a main-branch run half way through — it may be mid-tag.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pest:
    name: pest / php ${{ matrix.php }} / ${{ matrix.deps }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        deps: [lowest, highest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, sqlite3, pdo_sqlite
          coverage: none

      - name: Cache composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ matrix.php }}-${{ matrix.deps }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-${{ matrix.deps }}-

      # No composer.lock is committed (this is a library), so dependencies are
      # resolved fresh on every run. `lowest` proves the floors declared in
      # composer.json actually install; `highest` catches upstream breakage.
      - name: Install dependencies
        run: |
          composer update --no-interaction --no-progress --prefer-dist \
            ${{ matrix.deps == 'lowest' && '--prefer-lowest --prefer-stable' || '' }}

      - name: Show resolved versions
        run: composer show --direct

      - name: Run tests
        run: vendor/bin/pest --colors=always

  types:
    name: tsc
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run type-check

  pint:
    name: pint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Check formatting
        run: vendor/bin/pint --test

  tag:
    name: tag patch release
    runs-on: ubuntu-latest
    needs: [pest, types, pint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      # fetch-depth: 0 so the full tag history is available to find the latest.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: next
        run: |
          set -euo pipefail

          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          latest=${latest:-v0.0.0}
          IFS=. read -r major minor patch <<<"${latest#v}"

          # Default to a patch bump; `#minor` / `#major` in the commit message
          # overrides it, `#skip-tag` opts out entirely.
          message=$(git log -1 --pretty=%B)
          case "$message" in
            *'#skip-tag'*) echo "skip=true" >>"$GITHUB_OUTPUT"; exit 0 ;;
            *'#major'*)    major=$((major + 1)); minor=0; patch=0 ;;
            *'#minor'*)    minor=$((minor + 1)); patch=0 ;;
            *)             patch=$((patch + 1)) ;;
          esac

          echo "skip=false" >>"$GITHUB_OUTPUT"
          echo "previous=$latest" >>"$GITHUB_OUTPUT"
          echo "version=v$major.$minor.$patch" >>"$GITHUB_OUTPUT"

      - name: Create and push tag
        if: steps.next.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.next.outputs.version }}
          PREVIOUS: ${{ steps.next.outputs.previous }}
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git tag -a "$VERSION" -m "$VERSION"
          git push origin "$VERSION"

          echo "\`$PREVIOUS\` → **\`$VERSION\`**" >>"$GITHUB_STEP_SUMMARY"